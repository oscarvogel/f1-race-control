; Supervisor: los cuatro procesos de Race Center.
;
; Todos los logs salen por stdout/stderr para que Coolify los muestre en el
; panel de la aplicacion (en vez de quedar en archivos dentro del contenedor).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Socket para poder mirar el estado de los procesos desde adentro:
;   docker exec <contenedor> supervisorctl status
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:live-timing]
; Proveedor de cronometraje: el que habla con el feed SignalR de la F1.
; Escucha solo en loopback: no sale a la red del contenedor.
command=/usr/bin/node /app/services/live-timing/src/server.js
directory=/app/services/live-timing
environment=PORT="3000",HOST="127.0.0.1"
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
; API Django. Solo loopback: la salida a internet la hace nginx.
command=/usr/local/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -
directory=/app/backend
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ingest]
; Proceso de ingesta: escribe los snapshots que despues sirve la API.
command=/usr/local/bin/python manage.py ingest_live --interval 3
directory=/app/backend
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
