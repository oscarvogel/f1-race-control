# Sitio de Race Center.
#
# El SPA y la API se sirven desde el MISMO origen: nginx hace proxy de /api
# contra el backend en loopback. Por eso no hace falta CORS en el navegador.
#
# La proteccion la aplica nginx con `auth_request`: antes de dejar pasar una
# peticion a la API, nginx consulta /api/auth/check/, que responde 200 si la
# cookie de sesion es valida y 401 si no.
#
# El 401 NO lleva `WWW-Authenticate` a proposito: si lo llevara, el navegador
# abriria su dialogo nativo de usuario y contrasena -feo, en ingles y fuera
# del tema de la app-. Con esta configuracion, el frontend pinta su propia
# pantalla de acceso y el sitio se ve como el resto de la aplicacion.
#
# Si no hay credenciales configuradas (RACE_CENTER_USER / RACE_CENTER_PASSWORD
# vacias), el backend responde 200 siempre y la API queda abierta: es el modo
# de desarrollo local. Este archivo sirve para los dos casos.

server {
    listen 80 default_server;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    # Health check del orquestador (Coolify): responde sin proteccion. Solo
    # dice si la app vive, sin contarle nada a quien la consulta.
    location = /api/ping/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login, estado de sesion y cierre: sin proteccion. El login es justamente
    # lo que se protege con la sesion, asi que no puede depender de ella.
    location = /api/auth/login/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/session/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/logout/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Consulta de sesion para `auth_request`. `internal` la vuelve invisible
    # desde afuera: solo nginx puede pedirla.
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/check/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API interna: Django corre en loopback dentro del contenedor y exige
    # sesion valida.
    location /api/ {
        auth_request /_auth;
        error_page 401 = @sin_sesion;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La API no hace streaming, pero el snapshot historico puede tardar
        # varios segundos la primera vez (descarga de OpenF1).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Respuesta 401 de la API: JSON, para que el frontend la entienda.
    location @sin_sesion {
        default_type application/json;
        return 401 '{"ok": false, "error": "Sesion no iniciada o vencida."}';
    }

    # SPA: cualquier ruta desconocida devuelve index.html (enrutado del lado
    # del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets del build llevan hash en el nombre: se cachean para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html NO se cachea: es el que apunta a los assets con hash.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
