# Configuracion principal de nginx para Race Center.
#
# El SPA y la API se sirven desde el MISMO origen: nginx hace proxy de /api
# contra el backend en loopback. Por eso no hace falta CORS en el navegador.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # OJO: `include mime.types` va DENTRO de http. `types` no se puede usar
    # en el nivel principal de nginx.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # /etc/nginx/conf.d/site.conf lo genera el entrypoint (ver deploy/entrypoint.sh):
    # ahi se decide si el sitio lleva proteccion con usuario o no.
    include /etc/nginx/conf.d/*.conf;
}
